<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262250" />
      <stop offset="50%" stop-color="#1A1735" />
      <stop offset="100%" stop-color="#0E0C22" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(251, 216, 179, 0.45)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(200, 182, 255, 0.25)" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C5FF" />
      <stop offset="100%" stop-color="#9AD1FA" />
    </linearGradient>

    <linearGradient id="mintCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAF2DE" />
      <stop offset="100%" stop-color="#80D5BC" />
    </linearGradient>

    <linearGradient id="envelopeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4E6" />
      <stop offset="25%" stop-color="#FDE5CD" />
      <stop offset="100%" stop-color="#F5BD89" />
    </linearGradient>

    <linearGradient id="envelopeFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FCE1C3" />
      <stop offset="100%" stop-color="#F5B67B" />
    </linearGradient>

    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312B5E" />
      <stop offset="100%" stop-color="#171432" />
    </linearGradient>

    <linearGradient id="apricotGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6EC" />
      <stop offset="100%" stop-color="#FBD8B3" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#080716" flood-opacity="0.65" />
    </filter>

    <filter id="flapShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#52351E" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Squircle Base App Icon -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="119" fill="none" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Ambient Radial Glow in center -->
  <circle cx="256" cy="270" r="160" fill="#FBD8B3" opacity="0.12" filter="url(#softGlow)" />

  <!-- Back Floating Budget Cards -->
  <g filter="url(#cardShadow)">
    <!-- Lilac/Sky Ledger Card tucked in envelope -->
    <rect x="120" y="112" width="225" height="150" rx="22" transform="rotate(-8 230 190)" fill="url(#backCardGrad)" />
    <!-- Accents on lilac card -->
    <rect x="142" y="138" width="80" height="8" rx="4" transform="rotate(-8 230 190)" fill="#1A1735" opacity="0.4" />
    <rect x="142" y="156" width="55" height="8" rx="4" transform="rotate(-8 230 190)" fill="#1A1735" opacity="0.25" />

    <!-- Mint Cash Allocation Card -->
    <rect x="178" y="122" width="220" height="142" rx="22" transform="rotate(7 288 193)" fill="url(#mintCardGrad)" />
    <rect x="205" y="146" width="75" height="8" rx="4" transform="rotate(7 288 193)" fill="#1A1735" opacity="0.4" />
  </g>

  <!-- Main Velvet Apricot Envelope Body -->
  <g filter="url(#cardShadow)">
    <!-- Envelope Lower Pocket -->
    <rect x="88" y="195" width="336" height="215" rx="36" fill="url(#envelopeBody)" />

    <!-- Inner Pocket Crease Outline -->
    <path d="M 88,400 L 210,295 C 240,270 272,270 302,295 L 424,400" fill="none" stroke="#E29F68" stroke-width="4.5" opacity="0.4" stroke-linecap="round" />

    <!-- Envelope Folded Top Flap (Triangular with rounded tip) -->
    <path d="M 90,205 C 105,205 130,210 145,225 L 235,302 C 247,312 265,312 277,302 L 367,225 C 382,210 407,205 422,205 Z" fill="url(#envelopeFlap)" filter="url(#flapShadow)" />
    
    <!-- Crisp edge highlight on flap -->
    <path d="M 92,205 L 235,302 C 247,312 265,312 277,302 L 420,205" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85" />
  </g>

  <!-- Center Signature Emblem: Penne "P" Seal -->
  <g transform="translate(256, 308)" filter="url(#cardShadow)">
    <!-- Outer apricot gold ring -->
    <circle cx="0" cy="0" r="56" fill="url(#apricotGold)" />
    <!-- Inner deep velvet indigo medallion -->
    <circle cx="0" cy="0" r="48" fill="url(#sealGrad)" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="rgba(251, 216, 179, 0.45)" stroke-width="2.5" />
    
    <!-- Bold Geometric "P" Monogram -->
    <path d="M -16,-24 L -16,24 M -16,-24 L 2,-24 C 15,-24 23,-17 23,-6 C 23,5 15,12 2,12 L -16,12" 
          fill="none" 
          stroke="#FBD8B3" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
