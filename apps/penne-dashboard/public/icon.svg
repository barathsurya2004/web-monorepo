<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24201D" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2CC8F" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#38322E" stroke-width="4" />

  <!-- Inner Terracotta Squircle Badge -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="url(#iconGrad)" filter="url(#shadow)" />

  <!-- Inner Dark Wallet Container -->
  <rect x="116" y="116" width="280" height="280" rx="60" fill="#1A1715" />

  <!-- Vector Wallet Icon -->
  <g transform="translate(156, 156)">
    <!-- Wallet Body -->
    <rect x="10" y="40" width="180" height="130" rx="24" fill="url(#iconGrad)" />
    <!-- Wallet Flap Cover -->
    <path d="M 10,70 L 190,70 L 190,40 C 190,26.7 179.3,16 166,16 L 34,16 C 20.7,16 10,26.7 10,40 Z" fill="#E8A598" opacity="0.9" />
    <!-- Wallet Clasp -->
    <rect x="130" y="85" width="55" height="40" rx="12" fill="url(#coinGrad)" />
    <circle cx="150" cy="105" r="8" fill="#1A1715" />
    
    <!-- Rising Coin / Expense Sparkle -->
    <circle cx="100" cy="15" r="22" fill="url(#coinGrad)" filter="url(#shadow)" />
    <text x="100" y="22" font-family="sans-serif" font-size="20" font-weight="900" fill="#1A1715" text-anchor="middle">₹</text>
  </g>
</svg>
